<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZeroTrustX · Access Result</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div
        style="
            max-width:600px;
            margin:80px auto;
            padding:30px;
            background:#101a26;
            border:1px solid #2a3f55;
            border-radius:12px;
            color:white;
        "
    >

        <h2>🔐 Access Request Result</h2>

        <div
            style="
                margin-top:25px;
                padding:20px;
                border-radius:8px;
                background:#172333;
            "
        >

            <h2
                {% if decision == 'ALLOW' %}
                    style="color:#3dd68c;"
                {% else %}
                    style="color:#f47b7b;"
                {% endif %}
            >
                {{ decision }}
            </h2>

            <p>
                <strong>Risk Score:</strong>
                {{ risk_score }}
            </p>

            <p>
                <strong>Reason:</strong>
                {{ reason }}
            </p>

        </div>

        <br>

        <a
            href="/"
            style="color:#00c8b6;"
        >
            ← Back to Dashboard
        </a>

        <br>
        <br>

        <a
            href="/access-request"
            style="color:#00c8b6;"
        >
            Request Another Access
        </a>

    </div>

</body>

</html>
